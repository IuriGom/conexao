# City configuration: Belo Horizonte (MG) — PIPELINE REFERENCE CITY
# Chosen as the reference because its data is the simplest in Brazil:
# CC-BY license, no auth, positions refreshed every ~20 s.
# Rule (plan §9A.3): changes to this file are ALWAYS human-reviewed.

id: belo_horizonte
name: Belo Horizonte
region: Minas Gerais
country: BR
timezone: America/Sao_Paulo

bbox: [-44.15, -20.10, -43.80, -19.72]   # draft — verify in Phase 1

feeds:
  - id: bhtrans-bus
    mode: bus                            # conventional + MOVE (BRT) + supplementary
    # Resolved 2026-08-14 via dados.pbh.gov.br CKAN API (feed updated 2026-08-13):
    url: https://s3.amazonaws.com/mobilibus-uploads/gtfs/GTFSBHTRANS.zip
    provenance: official
    status: verified                     # compiles clean: 9,927 stops, 326 routes,
                                         # 113,692 trips, 6.67M stop_times -> 65 MB pack

  # Metrô BH (Linha 1, Eldorado–Vilarinho): no official open GTFS.
  # Check Mobility Database for community feeds in Phase 1; stations are in OSM.
  - id: metro-bh
    mode: subway
    url: null
    provenance: community
    status: to_find

live:
  # Resolved 2026-08-14 via CKAN "GTFS RT" dataset. NOTE: http:// cleartext —
  # per threat model (docs/ARCHITECTURE.md §security) label this data
  # lower-trust and allow-list the host in networkSecurityConfig.
  - id: bhtrans-rt-vehicle-positions
    type: gtfs-rt
    url: http://realtime4.mobilibus.com/web/4ch6j/vehicle-positions?accesskey=982a57efd77a9462bf1665696fb25984
    auth: embedded-key                   # key is public in the open-data portal
    license: CC-BY-4.0
  - id: bhtrans-rt-trip-updates
    type: gtfs-rt
    url: http://realtime4.mobilibus.com/web/4ch6j/trip-updates?accesskey=982a57efd77a9462bf1665696fb25984
    auth: embedded-key
    license: CC-BY-4.0
  - id: bhtrans-rt-alerts
    type: gtfs-rt
    url: http://realtime4.mobilibus.com/web/4ch6j/alerts?accesskey=982a57efd77a9462bf1665696fb25984
    auth: embedded-key
    license: CC-BY-4.0

license: CC-BY-4.0
attribution: >
  Empresa de Transportes e Trânsito de Belo Horizonte (BHTrans), dados abertos
  PBH (CC-BY-4.0). OpenStreetMap contributors (ODbL).

status:
  coverage: live_planned
  badge: LIVE
  notes: >
    Reference city for the pack pipeline and the first live adapter
    (easiest integration: open, keyless, 20 s refresh).
