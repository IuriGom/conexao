# City configuration: Brasília / Distrito Federal — LEAD CITY
#
# Schema (all cities follow this shape):
#   id, name, country, timezone
#   bbox            — [min_lon, min_lat, max_lon, max_lat] for tiles & search
#   feeds[]         — static GTFS sources; provenance: official | community | manual
#   live[]          — real-time adapters (type, endpoint, auth, refresh)
#   license/attribution
#   status          — data availability state, honestly labeled in the app
#
# Rule (plan §9A.3): changes to this file are ALWAYS human-reviewed.
# Plausible-and-wrong lives here.

id: brasilia
name: Brasília
region: Distrito Federal
country: BR
timezone: America/Sao_Paulo

# Covers Plano Piloto + main satellite cities (Ceilândia, Taguatinga,
# Samambaia, Planaltina, Gama, ...). VERIFY against pack contents later.
bbox: [-48.41, -16.06, -47.30, -15.45]   # draft — verify in Phase 1

feeds:
  # --- Official bus GTFS: NOT YET PUBLISHED (checked 2026-08-12) ---
  # Lei nº 7.836/2025-DF (sanctioned 24 Dec 2025) mandates open STPC/DF data,
  # including GTFS. SEMOB page exists but publishes only contracts/revenue:
  #   https://www.semob.df.gov.br/dados-do-sistema-de-transporte-publico-do-df/
  # Mobility Database: no DF feed found in catalogs (checked 2026-08-12).
  # The data demonstrably exists (official app "DF no Ponto"; Moovit/Cittamobi
  # have coverage) — it is just not published openly yet.
  - id: dftrans-stpc
    mode: bus
    url: null                    # to be filled the day Lei 7.836 is implemented
    provenance: official
    status: legally_mandated_but_unpublished
    action: file LAI request citing Lei 7.836/2025 (template: docs/LAI_BRASILIA.md)

  # --- Metrô-DF: timetables published on the operator site, not as GTFS ---
  # Community GTFS built 2026-08-15: pipeline/build_metro_df.py
  # (2 lines, 27 stations, OSM coordinates, interpolated run times,
  # headway-based with exact_times=0 → app labels departures approximate).
  - id: metro-df
    mode: subway
    url: https://www.metro.df.gov.br/    # timetables as HTML/PDF — verify exact source
    provenance: manual                   # community-encoded GTFS from published timetables
    status: built                        # pipeline/tmp/metro_df_gtfs.zip → brasilia.sqlite

live:
  # No public real-time API known for DF buses as of 2026-08-12.
  # "DF no Ponto" is the official app — its endpoints are undocumented;
  # do NOT scrape undocumented endpoints (terms/ethics); wait for the law.
  []

license: pending-official-feed       # Metrô-DF community feed: our encoding, sources credited
attribution: >
  Sistema de Transporte Público Coletivo do Distrito Federal (SEMOB-DF);
  Metrô-DF (horários publicados). OpenStreetMap contributors (ODbL).

status:
  coverage: metro_only_community
  badge: SCHEDULED
  blocker: bus GTFS not yet published (Lei 7.836/2025 not implemented)
  notes: >
    Lead city for design and dogfooding (maintainer is local). Metrô-DF
    community pack built 2026-08-15 (build_metro_df.py): 2 lines, 27
    stations, approximate headway-based times, honestly labeled in-app.
    Bus routing lands when the official feed is published or via LAI.
